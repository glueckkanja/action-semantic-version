name: Generate Semantic Version
description: >
  Computes the next semantic version (MAJOR.MINOR.PATCH), optionally with a
  prerelease identifier, creates a Git tag, and publishes a GitHub release
  with auto-generated release notes.

inputs:
  github-token:
    description: "GitHub token with contents:write permission for tagging and releasing"
    required: true
  prefix:
    description: "Optional prefix to prepend to generated tags (e.g., module names)"
    required: false
    default: ""
  suppress-release:
    description: "If true, skip creating a GitHub release"
    required: false
    default: "false"
  suppress-tag:
    description: "If true, skip creating a Git tag and release"
    required: false
    default: "false"
  check-last-commit-only:
    description: "If true, only inspect the most recent commit when determining bump type"
    required: false
    default: "false"
  is-prerelease:
    description: "If true, generate a prerelease version"
    required: false
    default: "false"
  prerelease-name:
    description: "Name for prerelease identifier (e.g., 'prerelease', 'rc', 'alpha')"
    required: false
    default: ""

outputs:
  version:
    description: "Calculated semantic version"
    value: ${{ steps.compute.outputs.version }}
  tag:
    description: "Created tag name"
    value: ${{ steps.compute.outputs.tag }}
  bump-type:
    description: "Type of bump applied (major, minor, patch)"
    value: ${{ steps.compute.outputs.bump-type }}
  previous-tag:
    description: "Most recent tag prior to calculation (if any)"
    value: ${{ steps.compute.outputs.previous-tag }}
  commit-subject:
    description: "Commit subject that drove the bump decision"
    value: ${{ steps.compute.outputs.commit-subject }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Compute next version
      id: compute
      env:
        PREFIX: ${{ inputs.prefix }}
        CHECK_LAST_COMMIT_ONLY: ${{ inputs.check-last-commit-only }}
        IS_PRERELEASE: ${{ inputs.is-prerelease }}
        PRERELEASE_NAME: ${{ inputs.prerelease-name }}
      shell: bash
      run: |
        bash "${{ github.action_path }}/scripts/compute-version.sh"

    - name: Write summary
      shell: bash
      env:
        VERSION: ${{ steps.compute.outputs.version }}
        TAG: ${{ steps.compute.outputs.tag }}
        BUMP_TYPE: ${{ steps.compute.outputs.bump-type }}
        PREVIOUS_TAG: ${{ steps.compute.outputs.previous-tag }}
        COMMIT_SUBJECT: ${{ steps.compute.outputs.commit-subject }}
      run: |
        bash "${{ github.action_path }}/scripts/write-summary.sh"

    - name: Create and push tag
      if: ${{ inputs.suppress-tag != 'true' }}
      env:
        TAG_NAME: ${{ steps.compute.outputs.tag }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        bash "${{ github.action_path }}/scripts/create-tag.sh"

    - name: Create GitHub release
      if: ${{ inputs.suppress-tag != 'true' && inputs.suppress-release != 'true' }}
      env:
        TAG_NAME: ${{ steps.compute.outputs.tag }}
        CHANGELOG_BASE_TAG: ${{ steps.compute.outputs.previous-tag-for-changelog }}
        GH_TOKEN: ${{ inputs.github-token }}
        IS_PRERELEASE: ${{ inputs.is-prerelease }}
      shell: bash
      run: |
        bash "${{ github.action_path }}/scripts/create-release.sh"
